<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client Tracker</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>Client Tracker</h1>
    <p class="tagline">Track clients, contacts, and engagement status.</p>
  </header>

  <!-- Auth view -->
  <main id="auth-view" class="container" hidden>
    <section class="card">
      <h2 id="auth-title">Sign In</h2>
      <form id="auth-form">
        <label id="name-label" for="auth-name" hidden>Name</label>
        <input type="text" id="auth-name" placeholder="Your name" hidden />
        <label for="auth-email">Email</label>
        <input type="email" id="auth-email" placeholder="you@example.com" required />
        <label for="auth-password">Password</label>
        <input type="password" id="auth-password" placeholder="At least 8 characters" required />
        <button type="submit" id="auth-submit">Sign In</button>
      </form>
      <p id="auth-status" class="status" hidden></p>
      <p class="switch">
        <button type="button" id="auth-toggle" class="link-button">Create an account</button>
      </p>
    </section>
  </main>

  <!-- App view -->
  <main id="app-view" class="container-wide" hidden>
    <section class="card">
      <div class="toolbar">
        <h2>Clients</h2>
        <div class="toolbar-actions">
          <div class="view-toggle">
            <button type="button" id="view-board" class="secondary active">Board</button>
            <button type="button" id="view-list" class="secondary">List</button>
          </div>
          <button type="button" id="fields-button" class="secondary">Manage Fields</button>
          <button type="button" id="new-client-button">+ New Client</button>
          <button type="button" id="logout-button" class="secondary">Sign out</button>
        </div>
      </div>
      <div class="filters">
        <input type="search" id="search" placeholder="Search name, company, email, tags..." />
      </div>

      <!-- Board view -->
      <div id="board-view">
        <div class="board">
          <div class="board-column" data-status="lead">
            <div class="column-header"><span class="dot dot-lead"></span> Lead <span class="count" id="count-lead">0</span></div>
            <div class="column-cards" data-drop="lead"></div>
          </div>
          <div class="board-column" data-status="active">
            <div class="column-header"><span class="dot dot-active"></span> Active <span class="count" id="count-active">0</span></div>
            <div class="column-cards" data-drop="active"></div>
          </div>
          <div class="board-column" data-status="past">
            <div class="column-header"><span class="dot dot-past"></span> Past <span class="count" id="count-past">0</span></div>
            <div class="column-cards" data-drop="past"></div>
          </div>
          <div class="board-column" data-status="lost">
            <div class="column-header"><span class="dot dot-lost"></span> Lost <span class="count" id="count-lost">0</span></div>
            <div class="column-cards" data-drop="lost"></div>
          </div>
        </div>
      </div>

      <!-- List view -->
      <div id="list-view" hidden>
        <ul id="client-list" class="client-list">
          <li class="empty">Loading...</li>
        </ul>
      </div>
    </section>
  </main>

  <!-- Client editor dialog -->
  <dialog id="client-dialog">
    <form id="client-form">
      <h2 id="client-form-title">New Client</h2>
      <label for="client-name">Name *</label>
      <input type="text" id="client-name" required />
      <label for="client-company">Company</label>
      <input type="text" id="client-company" />
      <label for="client-email">Email</label>
      <input type="email" id="client-email" />
      <label for="client-phone">Phone</label>
      <input type="tel" id="client-phone" />
      <label for="client-status">Status</label>
      <select id="client-status">
        <option value="lead">Lead</option>
        <option value="active">Active</option>
        <option value="past">Past</option>
        <option value="lost">Lost</option>
      </select>
      <label for="client-tags">Tags (comma separated)</label>
      <input type="text" id="client-tags" placeholder="web, retainer" />

      <div id="custom-fields-container"></div>

      <div id="notes-section" hidden>
        <h3>Notes</h3>
        <ul id="note-list" class="note-list"></ul>
        <div class="note-add">
          <input type="text" id="note-input" placeholder="Add a note..." />
          <button type="button" id="note-add-button" class="secondary small">Add</button>
        </div>
      </div>

      <div class="dialog-actions">
        <button type="button" id="client-cancel" class="secondary">Cancel</button>
        <button type="submit" id="client-save">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Custom fields dialog -->
  <dialog id="fields-dialog">
    <h2>Custom Fields</h2>
    <p class="muted small">Define extra fields for client profiles (e.g. VAT number, website, birthday).</p>
    <form id="field-form">
      <div class="field-row">
        <input type="text" id="field-name" placeholder="Field name (e.g. VAT Number)" required />
        <select id="field-type">
          <option value="text">Text</option>
          <option value="number">Number</option>
          <option value="date">Date</option>
        </select>
        <label class="checkbox-label"><input type="checkbox" id="field-required" /> Required</label>
        <button type="submit" class="small" id="field-save">Add</button>
      </div>
    </form>
    <ul id="field-list" class="field-list"></ul>
    <div class="dialog-actions">
      <button type="button" id="fields-done" class="secondary">Done</button>
    </div>
  </dialog>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
